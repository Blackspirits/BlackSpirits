name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&theme=catppuccin_mocha&bg_color=1e1e2e&title_color=cba6f7&icon_color=89b4fa&text_color=cdd6f4&ring_color=fab387
          path: assets/generated/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=467&theme=catppuccin_mocha&bg_color=1e1e2e&title_color=cba6f7&text_color=cdd6f4
          path: assets/generated/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Normalize top languages card
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("assets/generated/top-langs.svg")
          svg = path.read_text(encoding="utf-8")

          svg = svg.replace('height="140"', 'height="195"', 1)
          svg = svg.replace('viewBox="0 0 467 140"', 'viewBox="0 0 467 195"', 1)
          svg = svg.replace("font: 400 11px \"Segoe UI\", Ubuntu, Sans-Serif;", "font: 400 14px \"Segoe UI\", Ubuntu, Sans-Serif;")
          svg = svg.replace('transform="translate(25, 35)"', 'transform="translate(25, 48)"')
          svg = svg.replace('transform="translate(0, 55)"', 'transform="translate(0, 82)"')
          svg = svg.replace('transform="translate(150, 0)"', 'transform="translate(235, 0)"')
          svg = svg.replace('<circle cx="5" cy="6" r="5"', '<circle cx="5.5" cy="6.5" r="5.5"')

          path.write_text(svg, encoding="utf-8")
          PY

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/generated/stats.svg assets/generated/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(readme): update GitHub stats cards"
          git pull --rebase origin main
          git push origin HEAD:main
