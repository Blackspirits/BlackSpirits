name: Check links

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: '--config lychee.toml --verbose --no-progress "./**/*.md"'
          fail: true
